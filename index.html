<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent Mood Tracker</title>
    <link rel="stylesheet" href="scent.css">
</head>
<body>
    <div class="container">
        <h2>Scent Mood Tracker</h2>
        <input type="text" id="scent" placeholder="Enter a scent">
        <input type="text" id="feeling" placeholder="How did it make you feel?">
        <button onclick="addScent()">Add Scent</button>
        <button onclick="analyzeMoods()">Analyze</button>
        <div id="results"></div>
    </div>
    <script src="scent.js"></script>
</body>
</html>
